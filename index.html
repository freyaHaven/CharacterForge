<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // apply the saved theme before anything paints, so dark mode doesn't flash white
  try {
    var s = JSON.parse(localStorage.getItem('cf.settings.v1') || '{}'), t = s.theme || 'system';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="app"><p style="padding:24px">Loading Character Forge…</p></div>
<noscript><p style="padding:24px">Character Forge needs JavaScript to run.</p></noscript>

</body>
</html>
